<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" width="640" height="326" role="img" aria-label="From test cases to useful feedback">
<title>From test cases to useful feedback</title>
<style>.bg{fill:#f6f7f5}.box{fill:#fff;stroke:#bdccc5}.accent{fill:#e4f0ea;stroke:#84aa97}.ink{fill:#203a30}.muted{fill:#475e53}.line{stroke:#668878;fill:none;stroke-width:2}@media(prefers-color-scheme:dark){.bg{fill:#101715}.box{fill:#18221e;stroke:#3a5145}.accent{fill:#203d30;stroke:#6a9c80}.ink{fill:#e8f2ec}.muted{fill:#bed0c4}.line{stroke:#8fb5a0}}</style>
<rect class="bg" width="640" height="326" rx="14"/>
<g font-family="Arial,sans-serif">

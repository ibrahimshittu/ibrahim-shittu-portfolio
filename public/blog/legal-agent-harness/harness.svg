<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" width="640" height="408" role="img" aria-label="The harness around the model">
<title>The harness around the model</title>
<style>.bg{fill:#f6f7f5}.box{fill:#fff;stroke:#bdccc5}.accent{fill:#e4f0ea;stroke:#84aa97}.ink{fill:#203a30}.muted{fill:#475e53}.line{stroke:#668878;fill:none;stroke-width:2}@media(prefers-color-scheme:dark){.bg{fill:#101715}.box{fill:#18221e;stroke:#3a5145}.accent{fill:#203d30;stroke:#6a9c80}.ink{fill:#e8f2ec}.muted{fill:#bed0c4}.line{stroke:#8fb5a0}}</style>
<rect class="bg" width="640" height="408" rx="14"/>
<g font-family="Arial,sans-serif">
<text class="ink" x="24" y="37" font-size="24" font-weight="600">The harness around the model</text>
<rect class="box" x="24" y="61" width="592" height="66" rx="10"/>
<text class="ink" x="320.0" y="91" font-size="23" text-anchor="middle" font-weight="600">Task + context</text>
<text class="muted" x="320.0" y="119" font-size="20" text-anchor="middle">Documents, instructions, company and period</text>
<path class="line" d="M320 127 V150"/>
<rect class="accent" x="24" y="162" width="244" height="90" rx="10"/>
<text class="ink" x="146.0" y="192" font-size="23" text-anchor="middle" font-weight="600">Model</text>
<text class="muted" x="146.0" y="220" font-size="20" text-anchor="middle">Chooses the next action</text>
<rect class="box" x="348" y="162" width="268" height="90" rx="10"/>
<text class="ink" x="482.0" y="192" font-size="23" text-anchor="middle" font-weight="600">Tools</text>
<text class="muted" x="482.0" y="220" font-size="20" text-anchor="middle">Search · read · edit</text>
<path class="line" d="M270 189 H346 M340 184 L346 189 L340 194 M346 225 H270 M276 220 L270 225 L276 230"/>
<path class="line" d="M320 150 H146 V160 M141 155 L146 160 L151 155 M146 253 V277 H514 M112 277 H146 M112 277 V293 M320 277 V293 M514 277 V293"/>
<rect class="box" x="24" y="295" width="176" height="84" rx="10"/>
<text class="ink" x="112.0" y="325" font-size="23" text-anchor="middle" font-weight="600">Memory</text>
<text class="muted" x="112.0" y="353" font-size="20" text-anchor="middle">Saved progress</text>
<rect class="box" x="220" y="295" width="200" height="84" rx="10"/>
<text class="ink" x="320.0" y="325" font-size="23" text-anchor="middle" font-weight="600">Feedback</text>
<text class="muted" x="320.0" y="353" font-size="20" text-anchor="middle">Checks + results</text>
<rect class="box" x="440" y="295" width="176" height="84" rx="10"/>
<text class="ink" x="528.0" y="325" font-size="23" text-anchor="middle" font-weight="600">Artifact</text>
<text class="muted" x="528.0" y="353" font-size="20" text-anchor="middle">Draft + sources</text>
</g></svg>
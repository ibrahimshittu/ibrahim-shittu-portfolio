<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1285" viewBox="0 0 640 1285" role="img" aria-labelledby="title desc"><style>@media (prefers-color-scheme:dark){rect[fill="#f5f6f3"]{fill:#111817}rect[fill="white"]{fill:#192320;stroke:#47685f}text[fill="#192f3a"]{fill:#e7eeeb}text[fill="#4d5c63"]{fill:#b1c3ba}text[fill="#1e5553"]{fill:#8fd2b7}path{stroke:#8fb7a8}}</style>
<title id="title">A bounded harness for disclosure work</title><desc id="desc">Illustrative design · the model selects work inside application-enforced boundaries</desc>
<rect width="640" height="1285" rx="18" fill="#f5f6f3"/>
<g font-family="Arial, sans-serif">
<text x="28" y="40" font-size="28" fill="#192f3a" font-weight="700">A bounded harness for disclosure work</text>
<text x="28" y="112" font-size="19" fill="#4d5c63" font-weight="400">Illustrative design · the model selects work inside</text>
<text x="28" y="138" font-size="19" fill="#4d5c63" font-weight="400">application-enforced boundaries</text>
<rect x="24" y="175" width="592" height="180" rx="12" fill="white" stroke="#9bb9b4"/>
<text x="44" y="206" font-size="21" fill="#1e5553" font-weight="700">01 / TASK BOUNDARY</text>
<text x="44" y="241" font-size="24" fill="#192f3a" font-weight="400">Request + authenticated scope + document</text>
<text x="44" y="272" font-size="24" fill="#192f3a" font-weight="400">version</text>
<text x="44" y="303" font-size="20" fill="#4d5c63" font-weight="400">Selected company, period, section and peers;</text>
<text x="44" y="330" font-size="20" fill="#4d5c63" font-weight="400">permission checks before retrieval</text>
<path d="M320,358 v16 m-5,-5 l5,5 l5,-5" fill="none" stroke="#527778" stroke-width="2"/>
<rect x="24" y="380" width="592" height="180" rx="12" fill="white" stroke="#9bb9b4"/>
<text x="44" y="411" font-size="21" fill="#1e5553" font-weight="700">02 / CONTEXT ASSEMBLY</text>
<text x="44" y="446" font-size="24" fill="#192f3a" font-weight="400">Task instructions + scoped memory + source</text>
<text x="44" y="477" font-size="24" fill="#192f3a" font-weight="400">registry</text>
<text x="44" y="508" font-size="20" fill="#4d5c63" font-weight="400">Keep target-company facts, peer precedents and</text>
<text x="44" y="535" font-size="20" fill="#4d5c63" font-weight="400">user preferences distinct</text>
<path d="M320,563 v16 m-5,-5 l5,5 l5,-5" fill="none" stroke="#527778" stroke-width="2"/>
<rect x="24" y="585" width="592" height="180" rx="12" fill="white" stroke="#9bb9b4"/>
<text x="44" y="616" font-size="21" fill="#1e5553" font-weight="700">03 / BOUNDED MODEL–TOOL LOOP</text>
<text x="44" y="651" font-size="24" fill="#192f3a" font-weight="400">Decide → validate tool call → execute →</text>
<text x="44" y="682" font-size="24" fill="#192f3a" font-weight="400">record → decide</text>
<text x="44" y="713" font-size="20" fill="#4d5c63" font-weight="400">Read / retrieve / clarify / propose · enforce</text>
<text x="44" y="740" font-size="20" fill="#4d5c63" font-weight="400">tool, step, time and cost limits</text>
<path d="M320,768 v16 m-5,-5 l5,5 l5,-5" fill="none" stroke="#527778" stroke-width="2"/>
<rect x="24" y="790" width="592" height="180" rx="12" fill="white" stroke="#9bb9b4"/>
<text x="44" y="821" font-size="21" fill="#1e5553" font-weight="700">04 / VALIDATE AND REVIEW</text>
<text x="44" y="856" font-size="24" fill="#192f3a" font-weight="400">Check references + assess support + show</text>
<text x="44" y="887" font-size="24" fill="#192f3a" font-weight="400">proposed diff</text>
<text x="44" y="918" font-size="20" fill="#4d5c63" font-weight="400">Missing evidence → clarify or partial draft ·</text>
<text x="44" y="945" font-size="20" fill="#4d5c63" font-weight="400">failed checks → bounded repair or stop</text>
<path d="M320,973 v16 m-5,-5 l5,5 l5,-5" fill="none" stroke="#527778" stroke-width="2"/>
<rect x="24" y="995" width="592" height="180" rx="12" fill="white" stroke="#9bb9b4"/>
<text x="44" y="1026" font-size="21" fill="#1e5553" font-weight="700">05 / CONTROLLED WRITE</text>
<text x="44" y="1061" font-size="24" fill="#192f3a" font-weight="400">Approve exact proposal + verify base</text>
<text x="44" y="1092" font-size="24" fill="#192f3a" font-weight="400">version → apply once</text>
<text x="44" y="1123" font-size="20" fill="#4d5c63" font-weight="400">Persist checkpoints and action receipts; uncertain</text>
<text x="44" y="1150" font-size="20" fill="#4d5c63" font-weight="400">writes require reconciliation</text>
<text x="28" y="1215" font-size="19" fill="#4d5c63" font-weight="400">Run state and traces span every stage. Model output</text>
<text x="28" y="1241" font-size="19" fill="#4d5c63" font-weight="400">never grants itself access or approval.</text>
</g></svg>